name: Nightly e2e

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: apps/mobile
      - name: Point Edge Functions at the fake Plant.id (never the real API)
        run: |
          printf 'PLANT_ID_BASE_URL=http://host.docker.internal:8787\nPLANT_ID_API_KEY=fake\n' > supabase/functions/.env
      - run: npx supabase start -x studio,postgres-meta,logflare,vector,realtime
      - run: npm run e2e
      - if: ${{ !cancelled() }}
        run: npm run e2e:speed
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            apps/mobile/playwright-report
            apps/mobile/test-results
          retention-days: 7
